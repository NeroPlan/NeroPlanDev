name: neroplan

services:
  proxy:
    build:
      context: ./proxy # 어디 경로의 도커파일 실행할지 알려주는 부분 -> 현재 경로의 도커파일!
    image : neroplan-proxy
    container_name: proxy
    ports:
      - "8080:80"
    environment:
      BACKEND_PLAN_URL: http://backendPlan:8080
      BACKEND_USER_URL: http://backendUser:8080
      FRONTEND_URL: http://frontend:80
    depends_on:
      - frontend
      - backendUser
      - backendPlan
    restart: always

  frontend:
    build:
      context:  ./frontend # 어디 경로의 도커파일 실행할지 알려주는 부분 -> 현재 경로의 도커파일!
    image : frontend
    container_name: frontend
    ports:
      - "3000:80"
    restart: always

  backendUser:
    build:
      context: backendUser # 어디 경로의 도커파일 실행할지 알려주는 부분 -> 현재 경로의 도커파일!
    env_file:
      - .env
    image : backend-user
    container_name: backendUser
    ports:
      - "4000:8080"
    restart: always
  
  backendPlan:
    build:
      context: backendPlan
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul # "오늘 계획" 기준 날짜를 한국 시간으로 - Railway 설정과 동일
    image: backend-plan
    container_name: backendPlan
    ports:
      - "4001:8080"
    depends_on:
      - postgres
      - aiService
    restart: always

  aiService:
    build:
      context: aiService
    env_file:
      - .env # GEMINI_API_KEY 필요 - 없으면 카테고리 분류만 실패하고 위험도 분석은 동작
    image: ai-service
    container_name: aiService
    ports:
      - "8000:8000"
    restart: always

    
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: neroplan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    