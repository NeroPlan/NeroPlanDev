spring:
  application:
    name: neroplan

  datasource:
    url: jdbc:postgresql://postgres:5432/neroplan
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

server:
  port: 8080

logging:
    level:
      org.springframework.web: DEBUG