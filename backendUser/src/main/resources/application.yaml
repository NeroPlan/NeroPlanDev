server:
  # proxy가 넘겨준 X-Forwarded-* 헤더로 OAuth 리다이렉트 주소(https://배포도메인/...)를 만들기 위해 필요
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

            scope:
              - profile
              - email
logging:
  level:
    org.springframework.security: TRACE

jwt:
  key: ${JWT_KEY}

app:
  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:8080/plan}
